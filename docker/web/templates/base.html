<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site }}{% endblock %}</title>
{% if refresh %}<meta http-equiv="refresh" content="10">{% endif %}
<style>
  :root { --line:#d8dde3; --muted:#667; --accent:#1f6f8b; --bg:#f7f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:#222; background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 28px;
           display:flex; align-items:baseline; gap:22px; }
  header h1 { font-size:19px; margin:0; letter-spacing:.04em; }
  header a { color:var(--accent); text-decoration:none; font-size:14px; }
  main { max-width:960px; margin:26px auto; padding:0 20px 60px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px;
          padding:22px 24px; margin-bottom:20px; }
  h2 { font-size:16px; margin:0 0 16px; }
  label.field { display:block; margin-bottom:16px; }
  label.field > span { display:block; font-weight:600; margin-bottom:5px; font-size:14px; }
  input[type=text], input[type=email], select, textarea {
      width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:5px;
      font:inherit; background:#fff; }
  .muted { color:var(--muted); font-size:13px; }
  .hint { color:var(--muted); font-size:13px; font-weight:400; }
  button { background:var(--accent); color:#fff; border:0; border-radius:5px;
           padding:10px 20px; font:inherit; cursor:pointer; }
  button.ghost { background:#fff; color:#444; border:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .state { font-size:12px; padding:2px 9px; border-radius:11px; border:1px solid; }
  .queued  { color:#7a6000; border-color:#e3cf8a; background:#fdf6e0; }
  .running { color:#14506b; border-color:#9fc6d6; background:#e6f2f7; }
  .done    { color:#1d6b32; border-color:#a9d3b3; background:#eaf5ec; }
  .failed, .interrupted, .cancelled { color:#8a2420; border-color:#e0a9a5; background:#fbeceb; }
  pre.log { background:#1f2430; color:#dfe4ee; padding:14px 16px; border-radius:6px;
            overflow:auto; max-height:380px; font-size:12.5px; line-height:1.45; }
  details summary { cursor:pointer; font-weight:600; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:0 20px; }
  .barcode { display:inline-block; width:135px; font-size:14px; }
  .errors { background:#fbeceb; border:1px solid #e0a9a5; color:#8a2420;
            padding:12px 16px; border-radius:6px; margin-bottom:18px; }
</style>
</head>
<body>
<header>
  <h1>{{ site }}</h1>
  <a href="/">Nuova analisi</a>
  <a href="/jobs">Analisi</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
