# Command line tools invoked by monica_v4.py (minimap2, racon, spades, ...).
# Kept in a separate environment from the Python runtime so that the pinned
# interpreters of the bioconda packages cannot clash with the analysis stack.
name: tools
channels:
  - conda-forge
  - bioconda
dependencies:
  - minimap2=2.31
  - samtools=1.24
  - bcftools=1.24
  - htslib=1.24          # provides bgzip and tabix
  - bwa=0.7.19
  - racon=1.5
  - porechop=0.2.4
  - kmer-jellyfish=2.3.1 # provides the `jellyfish` k-mer counter
  - spades=4.3.0
  - nanopolish=0.14.0
  - blast=2.17.0         # blastn, blastdbcmd, makeblastdb, blastdb_aliastool
  - krona=2.8.1          # ktImportTaxonomy
  - freebayes            # referenced by the FREEBAYES template
